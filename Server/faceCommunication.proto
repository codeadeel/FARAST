syntax = "proto3";

service faceService {
    rpc inference(serverInput) returns (serverOutput);
}
message serverInput {
    bytes imgs = 1;
    int32 batch = 2;
    int32 width = 3;
    int32 height = 4;
    int32 channel = 5;
    string dataType = 6;
    string detectionConfidence = 7;
    string nmsThreshold = 8;
    string boxCushion = 9;
    string boxArea = 10;
    string recogThres = 11;
    string fakeThres = 12;
    string trackerFrames = 13;
    string trackerIds = 14;
    string clientId = 15;
}

message serverOutput {
    string results = 1;
}
