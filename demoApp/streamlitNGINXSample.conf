# Example Server Configuration for NGINX

server {
    listen 80;
    listen [::]:80;

    server_name demo.codeadeel.com www.demo.codeadeel.com;

    location / {
        return 301 https://github.com/codeadeel$request_uri;
    }

    location /ggo {
        proxy_pass http://10.241.223.44:1237/camo;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
